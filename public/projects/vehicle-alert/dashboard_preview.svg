<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12121b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="feedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="amberPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Top Navigation / Application Bar -->
  <rect x="0" y="0" width="1200" height="56" fill="#0d0d14" stroke="#252535" stroke-width="1"/>
  
  <!-- App Icon & Title -->
  <circle cx="36" cy="28" r="12" fill="#f59e0b" opacity="0.2"/>
  <circle cx="36" cy="28" r="6" fill="#f59e0b"/>
  <text x="60" y="33" fill="#ffffff" class="sans" font-size="15" font-weight="700" letter-spacing="0.5">SMART VEHICLE AUTHENTICATION &amp; OWNER ALERT PLATFORM</text>
  
  <!-- Status Badges in Nav -->
  <g transform="translate(860, 16)">
    <!-- Live Webcam Badge -->
    <rect x="0" y="0" width="150" height="25" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="12.5" r="4" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="26" y="16.5" fill="#34d399" class="mono" font-size="10.5" font-weight="700">WEBCAM LIVE (30 FPS)</text>

    <!-- AI Engine Active -->
    <rect x="160" y="0" width="150" height="25" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="174" cy="12.5" r="4" fill="#fbbf24"/>
    <text x="186" y="16.5" fill="#fbbf24" class="mono" font-size="10.5" font-weight="700">AI OCR ENGINE: ON</text>
  </g>

  <!-- ================= LEFT COLUMN: LIVE VISION FEED (x: 32, y: 78, w: 660, h: 565) ================= -->
  <g transform="translate(32, 78)">
    <!-- Video Feed Container -->
    <rect width="660" height="565" rx="16" fill="url(#feedGrad)" stroke="#272738" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <!-- Feed Header Bar -->
    <rect width="660" height="42" rx="16" fill="#151522"/>
    <rect y="30" width="660" height="12" fill="#151522"/>
    <line x1="0" y1="42" x2="660" y2="42" stroke="#2a2a3e" stroke-width="1"/>
    
    <text x="20" y="26" fill="#e2e8f0" class="sans" font-size="13" font-weight="600">Live Video Recognition Stream // HD Optical Sensor</text>
    <text x="540" y="26" fill="#94a3b8" class="mono" font-size="11">LATENCY: 14ms</text>

    <!-- Mock Video Feed Canvas Area -->
    <rect x="16" y="58" width="628" height="420" rx="10" fill="#08080d" stroke="#1e1e2d" stroke-width="1"/>
    
    <!-- Vehicle Silhouette Representation -->
    <g transform="translate(114, 90)">
      <!-- Car Body Outline -->
      <path d="M 40 180 L 70 80 Q 90 40 140 40 L 290 40 Q 340 40 360 80 L 390 180 Q 400 230 380 250 L 50 250 Q 30 230 40 180 Z" fill="#171724" stroke="#2e2e46" stroke-width="2"/>
      <!-- Windshield -->
      <path d="M 90 85 L 140 52 L 290 52 L 340 85 Z" fill="#0d0d17" stroke="#252538" stroke-width="1.5"/>
      <!-- Rear lights -->
      <rect x="50" y="150" width="45" height="15" rx="4" fill="#dc2626" opacity="0.6"/>
      <rect x="335" y="150" width="45" height="15" rx="4" fill="#dc2626" opacity="0.6"/>
      
      <!-- Bumper -->
      <rect x="65" y="175" width="300" height="55" rx="6" fill="#11111c" stroke="#222235" stroke-width="1"/>

      <!-- LICENSE PLATE RECOGNITION BOX (Green AI Bounding Target) -->
      <g transform="translate(100, 185)">
        <!-- Pulsing AI Bounding Box -->
        <rect x="-10" y="-12" width="250" height="68" rx="4" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2" stroke-dasharray="8 4" filter="url(#glowGreen)"/>
        
        <!-- Plate Detection Label -->
        <rect x="-10" y="-30" width="185" height="18" rx="3" fill="#10b981"/>
        <text x="-4" y="-17" fill="#022c22" class="mono" font-size="10" font-weight="800">LICENSE PLATE DETECTED [99.4%]</text>

        <!-- The Actual High Security Number Plate -->
        <rect x="0" y="0" width="230" height="44" rx="4" fill="#ffffff" stroke="#111111" stroke-width="2"/>
        <!-- Blue IND band -->
        <rect x="0" y="0" width="28" height="44" rx="4" fill="#0038a8"/>
        <rect x="24" y="0" width="4" height="44" fill="#0038a8"/>
        <!-- Ashoka Chakra Sim -->
        <circle cx="14" cy="18" r="5" fill="#ffffff" opacity="0.9"/>
        <text x="8" y="34" fill="#ffffff" class="sans" font-size="7.5" font-weight="900" letter-spacing="0.5">IND</text>
        
        <!-- Registration Text -->
        <text x="44" y="30" fill="#0f172a" class="sans" font-size="22" font-weight="900" letter-spacing="3.5">MH 12 CD 5678</text>
      </g>
    </g>

    <!-- Scanning Overlay Elements -->
    <g stroke="#10b981" stroke-width="1.5" opacity="0.7">
      <!-- Crosshairs -->
      <line x1="28" y1="70" x2="48" y2="70"/>
      <line x1="28" y1="70" x2="28" y2="90"/>

      <line x1="632" y1="70" x2="612" y2="70"/>
      <line x1="632" y1="70" x2="632" y2="90"/>

      <line x1="28" y1="466" x2="48" y2="466"/>
      <line x1="28" y1="466" x2="28" y2="446"/>

      <line x1="632" y1="466" x2="612" y2="466"/>
      <line x1="632" y1="466" x2="632" y2="446"/>
    </g>

    <!-- Dual Mode Feed Controls (Webcam / Image Upload) -->
    <g transform="translate(16, 492)">
      <!-- Webcam Button (Active) -->
      <rect x="0" y="0" width="190" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="35" y="27" fill="#38bdf8" class="sans" font-size="12" font-weight="700">● Live Webcam Feed</text>

      <!-- Image Upload Button -->
      <rect x="202" y="0" width="190" height="45" rx="8" fill="#13131c" stroke="#252538" stroke-width="1"/>
      <text x="245" y="27" fill="#94a3b8" class="sans" font-size="12" font-weight="600">📁 Upload Test Image</text>

      <!-- Switch Camera Button -->
      <rect x="404" y="0" width="224" height="45" rx="8" fill="#13131c" stroke="#252538" stroke-width="1"/>
      <text x="445" y="27" fill="#94a3b8" class="sans" font-size="12" font-weight="600">⚙️ Calibrate OCR Filter</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: SECURITY VERIFICATION & OTP DISPATCH ================= -->
  <g transform="translate(712, 78)">
    
    <!-- 1. Database Match Status Card (Threat Detected) -->
    <g>
      <rect width="456" height="235" rx="16" fill="url(#cardGrad)" stroke="#dc2626" stroke-width="1.5" filter="url(#glowRed)"/>
      <rect width="456" height="40" rx="16" fill="#7f1d1d" fill-opacity="0.4"/>
      <rect y="28" width="456" height="12" fill="#7f1d1d" fill-opacity="0.4"/>
      <line x1="0" y1="40" x2="456" y2="40" stroke="#dc2626" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Card Title & Red Threat Badge -->
      <text x="18" y="26" fill="#fecaca" class="sans" font-size="13" font-weight="700">REGISTRATION DATABASE VERIFICATION</text>
      <rect x="330" y="9" width="112" height="22" rx="11" fill="#dc2626"/>
      <text x="342" y="24" fill="#ffffff" class="mono" font-size="10" font-weight="800">🚨 FLAGGED</text>

      <!-- Information Rows -->
      <g transform="translate(18, 56)">
        <!-- Row 1: Plate & Status -->
        <text x="0" y="16" fill="#94a3b8" class="sans" font-size="11">READ PLATE ALPHANUMERIC</text>
        <text x="0" y="38" fill="#ffffff" class="mono" font-size="18" font-weight="800" letter-spacing="1.5">MH 12 CD 5678</text>

        <text x="240" y="16" fill="#94a3b8" class="sans" font-size="11">SECURITY CLASSIFICATION</text>
        <rect x="240" y="22" width="170" height="24" rx="6" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1"/>
        <text x="250" y="38" fill="#f87171" class="mono" font-size="11" font-weight="700">STOLEN VEHICLE ALERT</text>

        <!-- Divider -->
        <line x1="0" y1="58" x2="420" y2="58" stroke="#252538" stroke-width="1"/>

        <!-- Row 2: Owner & Registered Contact -->
        <g transform="translate(0, 72)">
          <text x="0" y="14" fill="#94a3b8" class="sans" font-size="11">REGISTERED OWNER</text>
          <text x="0" y="34" fill="#e2e8f0" class="sans" font-size="13" font-weight="700">R. V. Boovaragavan (Verified)</text>

          <text x="240" y="14" fill="#94a3b8" class="sans" font-size="11">MOBILE CONTACT (MASKED)</text>
          <text x="240" y="34" fill="#38bdf8" class="mono" font-size="13" font-weight="700">+91 90873 •••••</text>
        </g>

        <!-- Row 3: Geo/Location Tag -->
        <g transform="translate(0, 126)">
          <text x="0" y="14" fill="#94a3b8" class="sans" font-size="11">CHECKPOINT LOCATION</text>
          <text x="0" y="32" fill="#cbd5e1" class="sans" font-size="12">Main Security Gate 01 // Campus Perimeter</text>

          <text x="240" y="14" fill="#94a3b8" class="sans" font-size="11">FLAG TIMESTAMP</text>
          <text x="240" y="32" fill="#cbd5e1" class="mono" font-size="11">Today, 10:08:14 AM IST</text>
        </g>
      </g>
    </g>

    <!-- 2. Automated OTP Security Protocol Card (x: 0, y: 250, w: 456, h: 215) -->
    <g transform="translate(0, 250)">
      <rect width="456" height="215" rx="16" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect width="456" height="38" rx="16" fill="#78350f" fill-opacity="0.3"/>
      <rect y="26" width="456" height="12" fill="#78350f" fill-opacity="0.3"/>
      <line x1="0" y1="38" x2="456" y2="38" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>

      <!-- Header -->
      <text x="18" y="24" fill="#fef3c7" class="sans" font-size="13" font-weight="700">AUTOMATED OTP OWNER NOTIFICATION PROTOCOL</text>
      
      <!-- Content -->
      <g transform="translate(18, 52)">
        <text x="0" y="14" fill="#cbd5e1" class="sans" font-size="11.5" font-weight="500">Security Trigger: Flagged Plate detected at surveillance checkpoint.</text>
        <text x="0" y="30" fill="#f59e0b" class="sans" font-size="11.5" font-weight="700">Instant One-Time-Password (OTP) verification dispatched to owner:</text>

        <!-- Simulated SMS Notification Box -->
        <rect x="0" y="44" width="420" height="66" rx="8" fill="#0d0d15" stroke="#333348" stroke-width="1"/>
        <text x="14" y="66" fill="#38bdf8" class="mono" font-size="11" font-weight="700">📲 SMS DISPATCH VIA TWILIO / REST GATEWAY:</text>
        <text x="14" y="85" fill="#f1f5f9" class="mono" font-size="11">"ALERT: Vehicle MH 12 CD 5678 scanned at Gate 01. OTP is </text>
        <text x="352" y="85" fill="#fbbf24" class="mono" font-size="12" font-weight="800">849201</text>
        <text x="398" y="85" fill="#f1f5f9" class="mono" font-size="11">."</text>
        <text x="14" y="100" fill="#94a3b8" class="sans" font-size="9.5">Dispatched to +91 90873 70020 • Delivery status: DELIVERED (0.8s)</text>

        <!-- Verification status pill -->
        <g transform="translate(0, 120)">
          <rect x="0" y="0" width="200" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
          <text x="14" y="18" fill="#34d399" class="mono" font-size="10.5" font-weight="700">STATUS: CHALLENGE SENT</text>

          <rect x="210" y="0" width="210" height="28" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
          <text x="224" y="18" fill="#fbbf24" class="mono" font-size="10.5" font-weight="700">AWAITING OWNER AUTH</text>
        </g>
      </g>
    </g>

    <!-- 3. Bottom Audit & Action Controls (x: 0, y: 480, w: 456, h: 85) -->
    <g transform="translate(0, 480)">
      <rect width="456" height="85" rx="14" fill="#13131c" stroke="#252538" stroke-width="1"/>
      
      <!-- Action Buttons -->
      <g transform="translate(14, 14)">
        <!-- Trigger Campus Security Alert -->
        <rect x="0" y="0" width="206" height="38" rx="6" fill="#dc2626"/>
        <text x="24" y="24" fill="#ffffff" class="sans" font-size="11.5" font-weight="700">🚨 Alert Campus Security</text>

        <!-- Export Evidence / Log -->
        <rect x="218" y="0" width="210" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="242" y="24" fill="#e2e8f0" class="sans" font-size="11.5" font-weight="600">📄 Download Audit Report</text>
      </g>

      <text x="18" y="70" fill="#64748b" class="mono" font-size="9.5">AI ENGINE: Python • OpenCV • Tesseract OCR • SQLite • Twilio SMS API</text>
    </g>

  </g>
</svg>
